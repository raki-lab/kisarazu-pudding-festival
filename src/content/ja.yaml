faq:
  title: "よくある質問"
  items:
    - q: "入場料はかかりますか？"
      a: "入場は無料です。プリンやドリンクなど、各店舗での商品購入は別途料金がかかります。"
    - q: "予約は必要ですか？"
      a: "ご予約は不要です。どなたでも自由にご来場いただけます。"
    - q: "プリンは売り切れますか？"
      a: "数量限定の商品もあり、売り切れる場合があります。お目当てのプリンはお早めにお立ち寄りください。"
    - q: "持ち帰りできますか？"
      a: "はい、ほとんどの店舗でお持ち帰りが可能です。詳しくは各店舗にご確認ください。"
    - q: "保冷バッグは必要ですか？"
      a: "必須ではありませんが、お持ち帰りの際は保冷バッグのご持参をおすすめします。"
    - q: "支払い方法は何ですか？"
      a: "店舗ごとに異なります。現金のみの店舗もございますので、あらかじめご了承ください。"
    - q: "駐車場はありますか？"
      a: "はい、イオンモール木更津の駐車場をご利用いただけます。"
    - q: "雨天でも開催しますか？"
      a: "小雨決行です。荒天の場合は10月25日(日)の予備日に順延となります。"
    # - q: "ペットは同伴できますか？"
    #   a: "ペットの同伴については確認中です。決まり次第、公式SNSでお知らせします。"

